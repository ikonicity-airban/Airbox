<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/airbox.png" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/capacitor.js"></script>
    <title>Airbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background-color:#0b0e14;user-select:none;">
        <img src="/images/logo.png" style="width:76px;height:76px;object-fit:contain;margin-bottom:4px;" alt="Airbox" />
        <svg viewBox="0 0 500 100" style="width:min(440px,86vw);height:90px;overflow:visible;">
          <text x="50%" y="62%" text-anchor="middle" dominant-baseline="middle" style="font-family:'Outfit','Plus Jakarta Sans',sans-serif;font-size:54px;font-weight:800;letter-spacing:2px;fill:transparent;stroke:#7c3aed;stroke-width:1.5px;">
            Airbox
          </text>
        </svg>
        <div style="margin-top:20px;width:140px;height:2px;border-radius:999px;background:rgba(255,255,255,0.08);overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;bottom:0;width:45%;background:#7c3aed;border-radius:999px;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
